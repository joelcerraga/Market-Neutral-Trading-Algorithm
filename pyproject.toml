[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-neutral-research"
version = "0.5.0"
description = "Market-neutral research: graph comparison, causal topology features and reproducible controls"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.3,<3", "pandas>=2.2,<3", "scipy>=1.17,<2", "matplotlib>=3.10,<4", "plotly>=7.1,<8", "ripser==0.6.14", "persim==0.3.8", "scikit-learn==1.8.0"]

[tool.setuptools.packages.find]
include = ["market_neutral*"]
